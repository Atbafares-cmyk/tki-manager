<style>
:root{--p:#5B2C6F;--hdr:#5B2C6F;--s:#8E44AD;--a:#D2B4DE;--lo:#D2B4DE;--pt:#5B2C6F;--tx:#1A1A1A;--pg:#E8E0F0;--card:#fff;--ob:#EAE0F2;--hov:#FAF5FF;--sel:#F3E5F5;--dis:#C9B8D8;--track:#F0E8F8;--mut:#555;--fb:#FFFBEA;--fbd:#F0C040;--shadow:rgba(91,44,111,.1);color-scheme:light;}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Helvetica Neue',sans-serif;background:var(--pg);color:var(--tx);min-height:100vh;display:flex;justify-content:center;padding:56px 20px 20px;}
.app{width:100%;max-width:660px;}
.hdr{background:var(--hdr);color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:20px;}
.hdr .mod{font-size:9px;opacity:.7;text-transform:uppercase;letter-spacing:1.5px;}
.hdr h1{font-size:19px;font-weight:800;margin-top:4px;line-height:1.2;}
.hdr .sub{font-size:11px;opacity:.85;margin-top:4px;}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:var(--pt);font-weight:600;margin-bottom:5px;}
.bar-bg{height:7px;background:var(--a);border-radius:4px;margin-bottom:18px;}
.bar-fill{height:100%;background:var(--s);border-radius:4px;transition:width .3s;}
.card{background:var(--card);border-radius:12px;padding:22px;box-shadow:0 2px 14px var(--shadow);margin-bottom:16px;}
.q-tag{font-size:11px;color:var(--s);font-weight:700;margin-bottom:7px;}
.q-txt{font-size:15px;font-weight:600;line-height:1.55;margin-bottom:18px;}
.opt{padding:11px 15px;border-radius:8px;border:2px solid var(--ob);background:var(--card);cursor:pointer;font-size:13px;line-height:1.5;margin-bottom:9px;transition:all .15s;color:var(--tx);width:100%;text-align:left;}
.opt:hover{border-color:var(--s);background:var(--hov);}
.opt.sel{border-color:var(--pt);background:var(--sel);}
.btn{width:100%;padding:14px;background:var(--p);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s;font-family:inherit;}
.btn:disabled{background:var(--dis);cursor:not-allowed;}
.btn.sec{background:var(--card);color:var(--pt);border:2px solid var(--pt);}
.btn-row{display:flex;gap:12px;margin-bottom:8px;}
.res-section{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 2px 14px var(--shadow);margin-bottom:16px;}
.res-title{font-weight:700;color:var(--pt);font-size:14px;margin-bottom:14px;}
.score-bar{margin-bottom:10px;}
.score-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;}
.score-name{font-weight:600;}
.score-val{color:var(--s);font-weight:700;}
.bar2-bg{height:9px;background:var(--track);border-radius:5px;}
.bar2-fill{height:100%;border-radius:5px;transition:width .6s;}
.ranking{margin-top:14px;font-size:12px;color:var(--mut);line-height:2.2;}
.interp-box{background:var(--sel);border:2px solid var(--p);border-radius:12px;padding:18px;margin-bottom:16px;}
.interp-title{font-weight:800;color:var(--pt);font-size:15px;margin-bottom:12px;}
.interp-row{margin-bottom:9px;font-size:13.5px;line-height:1.65;}
.falc-box{background:var(--fb);border:2px solid var(--fbd);border-radius:12px;padding:16px;margin-bottom:16px;}
.falc-title{font-weight:700;margin-bottom:9px;font-size:14px;}
.falc-box p{font-size:13px;line-height:2.1;}
.footer{border-top:1px solid var(--a);margin-top:8px;padding-top:12px;text-align:center;font-size:9px;color:var(--mut);}
svg.radar{display:block;margin:0 auto;}
@media print{
  body{background:#fff;padding:0;}.app{max-width:100%;}
  .btn,.btn-row,.theme-btn{display:none!important;}
  :root[data-theme="dark"]{--p:#5B2C6F;--hdr:#5B2C6F;--s:#8E44AD;--a:#D2B4DE;--lo:#D2B4DE;--pt:#5B2C6F;--tx:#1A1A1A;--pg:#fff;--card:#fff;--sel:#F3E5F5;--track:#F0E8F8;--mut:#555;--fb:#FFFBEA;--fbd:#F0C040;}
  .hdr,.interp-box{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
@media(max-width:500px){.hdr h1{font-size:16px;}.q-txt{font-size:14px;}.opt{font-size:12px;}}
</style>
</head>

let P,S,A,LO,PT;
function readColors(){const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();P=g('--p');S=g('--s');A=g('--a');LO=g('--lo');PT=g('--pt');}
function applyTheme(th){
  document.documentElement.setAttribute('data-theme',th);
  const b=document.getElementById('themeBtn');
  b.textContent=th==='dark'?'☀️ Affichage clair':'🌙 Affichage sombre';
  b.setAttribute('aria-label',th==='dark'?'Passer en affichage clair':'Passer en affichage sombre');
  readColors();
}
function toggleTheme(){
  const th=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  try{localStorage.setItem('tki-theme',th);}catch(e){}
  applyTheme(th);render();
}
(function(){
  let th=null;
  try{th=localStorage.getItem('tki-theme');}catch(e){}
  if(th!=='dark'&&th!=='light')th=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  applyTheme(th);
})();

const DEEP=[["Je laisse parfois aux autres la responsabilité de résoudre un problème.", "Plutôt que de négocier les choses sur lesquelles nous ne sommes pas d'accord, j'essaie de mettre en avant celles sur lesquelles nous sommes tous deux d'accord.", 2, 1], ["J'essaie de trouver un compromis.", "J'essaie de traiter toutes mes préoccupations et celles de l'autre.", 3, 4], ["J'ai l'habitude de poursuivre fermement mes objectifs.", "Il m'arrive d'essayer d'apaiser l'autre et de préserver notre relation.", 0, 1], ["J'essaie de trouver un compromis.", "Il m'arrive parfois de sacrifier mes propres désirs pour satisfaire ceux de l'autre partie.", 3, 1], ["Je recherche systématiquement l'aide de l'autre partie pour trouver une solution.", "J'essaie de faire le nécessaire pour éviter les tensions inutiles.", 4, 2], ["J'essaie d'éviter de me retrouver dans des situations désagréables.", "J'essaie de gagner ma position.", 2, 0], ["J'essaie de reporter le problème jusqu'à ce que j'aie eu assez de temps pour y penser.", "Je cède certains points contre d'autres.", 2, 3], ["J'ai l'habitude de poursuivre fermement mes objectifs.", "J'essaie de mettre immédiatement à plat tous les problèmes et conflits.", 0, 4], ["Je pense qu'il ne faut pas toujours avoir peur des différences.", "Je fais des efforts pour obtenir ce que je veux.", 2, 0], ["J'ai l'habitude de poursuivre fermement mes objectifs.", "J'essaie de trouver un compromis.", 0, 3], ["J'essaie de mettre immédiatement à plat tous les problèmes et conflits.", "Il m'arrive d'essayer d'apaiser l'autre et de préserver notre relation.", 4, 1], ["J'évite parfois de prendre des positions qui provoqueraient une polémique.", "J'accepterai de céder certaines positions aux autres s'ils me laissent certaines des miennes.", 2, 3], ["Je propose de trouver un terrain d'entente.", "J'insiste pour que mes demandes soient satisfaites.", 3, 0], ["J'explique mes idées à l'autre et je lui demande les siennes.", "J'essaie de lui montrer la logique et function renderStart(){

function renderQ(){

    <div class="q-tag">${tag}</div>
    <div class="q-txt">${txt}</div>
    ${opts.map((o,i)=>`<button class="opt${sel===i?' sel':''}" onclick="choose(${i})">${o}</button>`).join('')}
  </div>
  <button class="btn"${sel===null?' disabled':''} onclick="next()">${cur<n-1?(deep?'Paire suivante →':'Question suivante →'):'Voir mes résultats 🎯'}</button>
  ${FOOT}`;
}

function computeScores(){
  if(mode==="deep"){const sc=[0,0,0,0,0];Object.keys(answers).forEach(k=>{sc[DEEP[k][2+answers[k]]]++;});return sc;}
  return STYLES.map((_,i)=>Object.values(answers).filter(v=>v===i).length);
}

function renderResults(){
  const deep=mode==="deep",MX=MAXS();
  const scores=computeScores();
  const sorted=[...scores.map((s,i)=>({s,i}))].sort((a,b)=>b.s-a.s);
  const domI=sorted[0].i;
  const ip=INTERP[domI];
  const tops=sorted.filter(x=>x.s===sorted[0].s),tie=tops.length>1;
  const bars=sorted.map(({s,i})=>`<div class="score-bar">
    <div class="score-row"><span class="score-name">${ICONS[i]} ${STYLES[i]}</span><span class="score-val">${s}/${MX}</span></div>
    <div class="bar2-bg"><div class="bar2-fill" style="width:${s/MX*100}%;background:${i===domI?PT:LO}"></div></div>
  </div>`).join('');
  return`<div class="hdr">
    <div class="mod">Tes résultats - ${deep?"test approfondi":"test rapide"}</div>
    <h1>🎯 Profil TKI - ${ip.titre}</h1>
    <div class="sub">Module "Le Manager face aux conflits" - 23 MindSet</div>
  </div>
  <div class="res-section">
    <div class="res-title">📊 Ton graphique de styles</div>
    ${buildRadar(scores,MX)}
  </div>
  <div class="res-section">
    <div class="res-title">📈 Scores détaillés</div>
    ${bars}
    <div class="ranking">
      🥇 <strong>Dominant :</strong> ${ICONS[sorted[0].i]} ${STYLES[sorted[0].i]} &nbsp;|&nbsp;
      🥈 <strong>Secondaire :</strong> ${ICONS[sorted[1].i]} ${STYLES[sorted[1].i]} &nbsp;|&nbsp;
      ⬇️ <strong>Moins utilisé :</strong> ${ICONS[sorted[4].i]} ${STYLES[sorted[4].i]}
      ${tie?`<br/>⚖️ <strong>Égalité :</strong> ${tops.map(x=>ICONS[x.i]+" "+STYLES[x.i]).join(", ")} sont à égalité en tête. Ce sont tes styles principaux.`:""}
    </div>
  </div>
  <div class="interp-box">
    <div class="interp-title">${ip.titre}</div>
    <div class="interp-row">✅ <strong>Ce que tu apportes :</strong> ${ip.apport}</div>
    <div class="interp-row">⚠️ <strong>Le risque :</strong> ${ip.risque}</div>
    <div class="interp-row">👉 <strong>À développer en priorité :</strong> ${ip.dev}</div>
  </div>
  <div class="falc-box">
    <div class="falc-title">💬 EN MOTS SIMPLES</div>
    <p>👉 Tu as un style principal pour gérer les conflits.</p>
    <p>✅ Ce style a des forces. Il fonctionne dans certaines situations.</p>
    <p>⚠️ Utilisé tout le temps, il peut poser problème.</p>
    <p>👉 L'objectif : choisir le bon style selon la situation.</p>
  </div>
  ${deep?"":`<div class="btn-row"><button class="btn sec" onclick="start('deep')">🔍 Affiner avec le test approfondi (30 paires)</button></div>`}
  <div class="btn-row">
    <button class="btn" onclick="window.print()">🖨️ Imprimer mes résultats</button>
    <button class="btn sec" onclick="reset()">🔄 Refaire le test</button>
  </div>
  ${FOOT}`;
}

function buildRadar(scores,MX){
  const W=280,H=260,cx=W/2,cy=H/2,R=95,n=5,step=2*Math.PI/n;
  const pts=r=>Array.from({length:n},(_,i)=>{const a=i*step-Math.PI/2;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];});
  const rings=[0.2,0.4,0.6,0.8,1].map(f=>{const p=pts(R*f).map(([x,y])=>x+","+y).join(" ");return`<polygon points="${p}" fill="none" stroke="${A}" stroke-width="1"/>`;}).join('');
  const axes=Array.from({length:n},(_,i)=>{const[x,y]=pts(R)[i],[lx,ly]=pts(R+20)[i];return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${A}" stroke-width="1"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="700" fill="${PT}">${ICONS[i]} ${STYLES[i]}</text>`;}).join('');
  const dp=scores.map((s,i)=>{const[x,y]=pts(R*s/MX)[i];return x+","+y;}).join(" ");
  const dots=scores.map((s,i)=>{const[x,y]=pts(R*s/MX)[i];return`<circle cx="${x}" cy="${y}" r="4" fill="${PT}"/>`;}).join('');
  return`<svg class="radar" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${rings}${axes}<polygon points="${dp}" fill="${S}" fill-opacity="0.35" stroke="${PT}" stroke-width="2"/>${dots}</svg>`;
}

function start(m){mode=m;cur=0;answers={};sel=null;render();}
function choose(i){sel=i;render();}
function next(){if(sel===null)return;answers[cur]=sel;sel=null;cur++;render();}
function reset(){mode=null;cur=0;answers={};sel=null;render();}

render();
</script>
</body>
</html>
